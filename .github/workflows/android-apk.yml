name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates/**
            ~/.config/godot/**
            /usr/local/bin/godot
          key: ${{ runner.os }}-godot-4.7-android-v2
      - name: Download Godot 4.7 and Android templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          mkdir -p ~/.config/godot
          mv templates/* ~/.local/share/godot/export_templates/4.7.stable/
          mv Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          rm -f Godot_v4.7-stable_linux.x86_64.zip Godot_v4.7-stable_export_templates.tpz
      - name: Configure Godot Android SDK and debug signing
        shell: bash
        run: |
          mkdir -p ~/.config/godot
          keytool -genkeypair -v -keystore ~/.config/godot/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -noprompt
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.config/godot/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Install Godot Android build template
        shell: bash
        run: |
          mkdir -p android/plugins
          mkdir -p android/build
          touch android/build/.gdignore
          printf '4.7.stable' > android/.build_version
          unzip -q ~/.local/share/godot/export_templates/4.7.stable/android_source.zip -d android/build
      - name: Import project
        shell: bash
        continue-on-error: true
        run: timeout 60 godot --headless --path . -e --quit
      - name: Export debug APK
        shell: bash
        run: |
          godot --headless --path . --export-debug Android CarRaceGames.apk
          test -s CarRaceGames.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Car-Race-Games-APK
          path: CarRaceGames.apk
          if-no-files-found: error
